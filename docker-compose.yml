# docker-compose.yml - Stack completo para AIOps Log Monitor
# Uso:
#   docker compose up --build   # levanta db + app
#   docker compose down         # detiene todo
#
# Variables de entorno (opcional):
#   DATABASE_URL=postgresql://aion:aion@localhost:5432/aioplogmonitor
version: "3.9"

services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aioplogmonitor
      POSTGRES_USER: aion
      POSTGRES_PASSWORD: aion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aion -d aioplogmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aiops

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://aion:aion@postgres:5432/aioplogmonitor"
      AIOPS_MODEL_PATH: "src/artifacts/aioplogmonitor_models_v0.1.0.pkl"
      AIOPS_CSV_PATH: "data/sample.csv"
    ports:
      - "8000:8000"
    networks:
      - aiops

volumes:
  pgdata:

networks:
  aiops:
    driver: bridge