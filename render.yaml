services:
  - type: web
    name: aiops-log-monitor
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aiops-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"
      - key: AIOPS_MODEL_PATH
        value: "src/artifacts/aioplogmonitor_models_v0.1.0.pkl"

databases:
  - name: aiops-db
    plan: free
    databaseName: aiops
    user: aiops
